<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel – Easy Library</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body class="app-page">

  <nav class="app-nav">
    <div class="nav-brand">
      <div class="brand-icon sm">📚</div>
      <span class="brand-name">Easy Library</span>
      <span class="admin-badge-nav">ADMIN</span>
    </div>
    <div class="nav-right">
      <button class="btn btn-danger-outline" id="logout-btn">Logout</button>
    </div>
  </nav>

  <main class="app-main">
    <h1 class="page-title">Admin Dashboard</h1>

    <!-- Stats -->
    <div class="admin-stats">
      <div class="admin-stat-card">
        <div class="astat-num" id="stat-books">0</div>
        <div class="astat-label">Total Books</div>
      </div>
      <div class="admin-stat-card">
        <div class="astat-num" id="stat-issued">0</div>
        <div class="astat-label">Books Issued</div>
      </div>
      <div class="admin-stat-card">
        <div class="astat-num" id="stat-users">0</div>
        <div class="astat-label">Students</div>
      </div>
      <div class="admin-stat-card">
        <div class="astat-num" id="stat-overdue">0</div>
        <div class="astat-label">Overdue</div>
      </div>
    </div>

    <!-- Admin Tabs -->
    <div class="mybooks-tabs">
      <button class="tab-btn active" data-tab="books">Books</button>
      <button class="tab-btn" data-tab="users">Users</button>
      <button class="tab-btn" data-tab="requests">Requests</button>
    </div>

    <!-- Books Tab -->
    <div id="tab-books">
      <div class="admin-toolbar">
        <input type="text" id="admin-search" placeholder="Search books..." class="admin-search-input"/>
        <button class="btn btn-primary" id="add-book-btn">+ Add Book</button>
      </div>
      <div id="admin-book-list"></div>
    </div>

    <!-- Users Tab -->
    <div id="tab-users" class="hidden">
      <div id="admin-user-list"></div>
    </div>

    <!-- Requests Tab -->
    <div id="tab-requests" class="hidden">
      <div id="admin-request-list"></div>
    </div>
  </main>

  <!-- Add/Edit Book Modal -->
  <div class="modal hidden" id="book-form-modal">
    <div class="modal-box">
      <button class="modal-close" id="close-book-form">✕</button>
      <h3 id="book-form-title">Add Book</h3>
      <input type="hidden" id="edit-book-id"/>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="book-title" placeholder="Book title"/>
      </div>
      <div class="form-group">
        <label>Author</label>
        <input type="text" id="book-author" placeholder="Author name"/>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="book-category">
          <option value="science">Science</option>
          <option value="fiction">Fiction</option>
          <option value="history">History</option>
          <option value="cs">CS & Engineering</option>
        </select>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="book-desc" placeholder="Short description" rows="3"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Rack</label>
          <input type="text" id="book-rack" placeholder="e.g. R-14"/>
        </div>
        <div class="form-group">
          <label>Copies</label>
          <input type="number" id="book-copies" placeholder="e.g. 3" min="1"/>
        </div>
      </div>
      <button class="btn btn-primary btn-full" id="save-book-btn">Save Book</button>
    </div>
  </div>
  <div class="modal-backdrop hidden" id="modal-backdrop"></div>

  <div id="toast" class="toast hidden"></div>

  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
