<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard – Easy Library</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body class="app-page">

  <!-- TOP NAV -->
  <nav class="app-nav">
    <div class="nav-brand">
      <div class="brand-icon sm">📚</div>
      <span class="brand-name">Easy Library</span>
    </div>
    <div class="nav-right">
      <span class="user-badge">👤 <span id="nav-username">Alex</span></span>
      <button class="btn btn-danger-outline" id="logout-btn">Logout</button>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="app-main">
    <div class="greeting">
      <span class="greeting-sm">Good morning,</span>
      <h1 class="greeting-name">Welcome, <span id="dash-username">Alex</span> 👋</h1>
    </div>

    <section class="quick-actions">
      <h2 class="section-label">Quick Actions</h2>
      <div class="actions-grid">
        <a href="catalog.html" class="action-card action-primary">
          <div class="action-icon">🔍</div>
          <div class="action-label">Search Books</div>
        </a>
        <a href="catalog.html" class="action-card">
          <div class="action-icon-sm">📊</div>
          <div>
            <div class="action-title">Check Availability</div>
            <div class="action-desc">Find open books</div>
          </div>
        </a>
        <a href="mybooks.html" class="action-card">
          <div class="action-icon-sm">⚠️</div>
          <div>
            <div class="action-title">Request Issue</div>
            <div class="action-desc">Reserve a book</div>
          </div>
        </a>
      </div>
    </section>

    <section class="currently-reading">
      <div class="section-header">
        <h2 class="section-label">Currently Reading</h2>
        <a href="mybooks.html" class="view-all">View All</a>
      </div>
      <div id="reading-list"></div>
    </section>

    <section class="recommended">
      <h2 class="section-label">Recommended for You</h2>
      <div id="recommended-list" class="rec-grid"></div>
    </section>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="bnav-item active">
      <span>🏠</span><span>Home</span>
    </a>
    <a href="catalog.html" class="bnav-item">
      <span>🔍</span><span>Search</span>
    </a>
    <a href="mybooks.html" class="bnav-item">
      <span>📚</span><span>My Books</span>
    </a>
  </nav>

  <script src="../js/app.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
